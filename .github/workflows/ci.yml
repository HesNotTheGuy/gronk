name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing in this workflow publishes or writes to the repo.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Gronk ships on all three; path handling and process-kill differ per OS.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.18 is the floor declared in package.json "engines", so it is the
        # version every platform is held to.
        node: ['22.18']
        # ...plus one job on current Node. Both directions have to be covered:
        # a Node 22 linker bug once broke the suite on the floor while it passed
        # on the maintainer's Node 24, and only CI saw it. The reverse is just as
        # possible, so neither end of the supported range goes untested.
        include:
          - os: ubuntu-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and runs no
      # lifecycle scripts from dependencies.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test

  build:
    name: electron-vite build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci --ignore-scripts
      # Bundling only — no electron-builder, no signing, no artifacts published.
      - run: npm run build

  supply-chain:
    name: malware scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      # No install needed: the scan reads package-lock.json, so it runs before
      # anything from npm has touched this machine.
      - name: Check resolved versions against known-malicious releases
        run: node ./scripts/security-check.mjs

      # Known CVEs, which is a different question from "was this release
      # poisoned". Advisory only: a fresh CVE in a transitive dependency should
      # not block an unrelated pull request.
      - name: Known vulnerabilities (advisory)
        run: npm audit --audit-level=high || true
