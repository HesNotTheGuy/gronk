name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing in this workflow publishes or writes to the repo.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Grocky ships on all three; path handling and process-kill differ per OS.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Native TypeScript type stripping (used by `npm test`) needs Node 22.18+.
          node-version: '22.18'
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and runs no
      # lifecycle scripts from dependencies.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test

  build:
    name: electron-vite build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci --ignore-scripts
      # Bundling only — no electron-builder, no signing, no artifacts published.
      - run: npm run build
