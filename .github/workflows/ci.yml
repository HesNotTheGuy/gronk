name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing in this workflow publishes or writes to the repo.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Gronk ships on all three; path handling and process-kill differ per OS.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Native TypeScript type stripping (used by `npm test`) needs Node 22.18+.
          node-version: '22.18'
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and runs no
      # lifecycle scripts from dependencies.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test

  build:
    name: electron-vite build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci --ignore-scripts
      # Bundling only — no electron-builder, no signing, no artifacts published.
      - run: npm run build

  supply-chain:
    name: malware scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      # No install needed: the scan reads package-lock.json, so it runs before
      # anything from npm has touched this machine.
      - name: Check resolved versions against known-malicious releases
        run: node ./scripts/security-check.mjs

      # Known CVEs, which is a different question from "was this release
      # poisoned". Advisory only: a fresh CVE in a transitive dependency should
      # not block an unrelated pull request.
      - name: Known vulnerabilities (advisory)
        run: npm audit --audit-level=high || true
